title: "Brock's Bodybuilding Journal"
description: "Training logs and exercise notes"
profile_image: /assets/images/bmf.png
accent_color: "#F6E27F"
theme: minima
permalink: /:year/:month/:day/:title.html

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  - scope:
      path: "_posts/first-show"
      type: posts
    values:
      categories: ["first-show"]